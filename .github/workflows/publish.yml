# 发布 GitHub Release 时自动发布到 npm
# 使用 npm Trusted Publishing（OIDC），无需在仓库中配置 NPM_TOKEN，
# 需要先在 npmjs.com 的包设置中把本仓库和本 workflow 文件添加为 Trusted Publisher
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check tag matches package.json version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Publish
        run: npm publish
